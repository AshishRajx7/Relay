<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/></filter>
</defs><text x="50" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26px" fill="#f8fafc" font-weight="700" text-anchor="start">Relay — Async Queue Architecture</text><text x="50" y="73" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14px" fill="#94a3b8" font-weight="400" text-anchor="start">BullMQ + Redis keep long-running research and generation off the HTTP request path.</text><rect x="50" y="120" width="230" height="90" rx="14" fill="#172033" stroke="#334155" stroke-width="1.5"/><text x="165" y="155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19px" fill="#f8fafc" font-weight="700" text-anchor="middle">NestJS API</text><text x="165" y="181" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" fill="#94a3b8" font-weight="400" text-anchor="middle">enqueue jobs</text><rect x="375" y="100" width="250" height="130" rx="14" fill="#111827" stroke="#84cc16" stroke-width="1.5"/><text x="500" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21px" fill="#f8fafc" font-weight="700" text-anchor="middle">Redis 7</text><text x="500" y="168" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13px" fill="#94a3b8" font-weight="400" text-anchor="middle">BullMQ queues</text><text x="500" y="192" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11px" fill="#64748b" font-weight="400" text-anchor="middle">waiting · active · failed · done</text><rect x="720" y="80" width="250" height="78" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/><text x="845" y="112" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15px" fill="#e2e8f0" font-weight="700" text-anchor="middle">resume-parsing</text><text x="845" y="136" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11px" fill="#94a3b8" font-weight="400" text-anchor="middle">parser worker</text><rect x="720" y="175" width="250" height="78" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/><text x="845" y="207" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15px" fill="#e2e8f0" font-weight="700" text-anchor="middle">company-research</text><text x="845" y="231" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11px" fill="#94a3b8" font-weight="400" text-anchor="middle">research worker</text><rect x="720" y="270" width="250" height="78" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/><text x="845" y="302" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15px" fill="#e2e8f0" font-weight="700" text-anchor="middle">draft-generation</text><text x="845" y="326" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11px" fill="#94a3b8" font-weight="400" text-anchor="middle">writer + verification worker</text><rect x="720" y="365" width="250" height="78" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/><text x="845" y="397" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15px" fill="#e2e8f0" font-weight="700" text-anchor="middle">gmail-draft</text><text x="845" y="421" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11px" fill="#94a3b8" font-weight="400" text-anchor="middle">staging worker</text><line x1="280" y1="165" x2="375" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="625" y1="145" x2="720" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="625" y1="175" x2="720" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="625" y1="205" x2="720" y2="305" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="625" y1="230" x2="720" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="300" width="570" height="135" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/><text x="345" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18px" fill="#f8fafc" font-weight="700" text-anchor="middle">Debugging rule</text><text x="345" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13px" fill="#e2e8f0" font-weight="600" text-anchor="middle">Always inspect actual Redis job state + PostgreSQL state</text><text x="345" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13px" fill="#94a3b8" font-weight="400" text-anchor="middle">before trusting a frontend progress counter.</text><text x="345" y="414" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12px" fill="#64748b" font-weight="400" text-anchor="middle">This is how stuck pipelines become diagnosable.</text>
</svg>