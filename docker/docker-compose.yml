services:
  postgres:
    image: postgres:16-alpine
    container_name: relay_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_dev_password
      POSTGRES_DB: relay
    volumes:
      - relay_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: relay_redis
    restart: unless-stopped
    command: redis-server --protected-mode no
    ports:
      - "6380:6379"
    volumes:
      - relay_redisdata:/data

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: relay_crawl4ai
    restart: unless-stopped
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=relay_crawl_secret
      - MAX_CONCURRENT_TASKS=5
      - TIMEOUT=30
    shm_size: "2gb"

  adminer:
    image: adminer:4
    container_name: relay_adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  relay_pgdata:
  relay_redisdata:
