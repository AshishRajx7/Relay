services:
  postgres:
    image: postgres:16-alpine
    container_name: relay_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_dev_password
      POSTGRES_DB: relay
    volumes:
      - relay_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: relay_redis
    restart: unless-stopped
    command: redis-server --protected-mode no
    ports:
      - "6380:6379"
    volumes:
      - relay_redisdata:/data

volumes:
  relay_pgdata:
  relay_redisdata:
